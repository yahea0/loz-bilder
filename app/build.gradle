
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luzbuild.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luzbuild.studio'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
